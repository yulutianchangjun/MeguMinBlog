# 宿主机 nginx 站点配置（单机生产参考版）：部署到 /etc/nginx/sites-enabled/blog.conf（把 your-domain.com 换成你的域名）
# 前端 dist 与 TLS 终止在宿主机 nginx；/api 与 /uploads 反代/映射到容器栈。
# 证书路径按你的域名替换（示例：your-domain.com.pem / .key）

# HTTP 全部跳转 HTTPS
server {
    listen 80;
    server_name your-domain.com www.your-domain.com admin.your-domain.com;
    location / {
        return 301 https://your-domain.com$request_uri;
    }
}

# 旧版独立后台子域 → 主站（新版后台已集成在主站内）
server {
    listen 443 ssl http2;
    server_name admin.your-domain.com;
    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    return 301 https://your-domain.com$request_uri;
}

# 博客主站
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 图片 8MB / 音频 30MB 上传
    client_max_body_size 35m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 前端 SPA
    location / {
        root /var/www/blog/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，保证发版即生效
        location = /index.html {
            root /var/www/blog/dist;
            add_header Cache-Control "no-cache";
        }
    }

    # 带内容哈希的构建产物，长缓存
    location /assets/ {
        root /var/www/blog/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # REST API（注意：不剥离 /api 前缀，后端路由本身就带 /api）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传的封面 / 音频
    location /uploads/ {
        alias /var/www/blog/data/uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public,no-transform";
    }
}
