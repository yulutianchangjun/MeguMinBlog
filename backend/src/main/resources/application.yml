server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: blog-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  sql:
    init:
      encoding: UTF-8
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  upload-url-prefix: /uploads
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl-days: 7
  turnstile:
    enabled: ${TURNSTILE_ENABLED:true}
    secret: ${TURNSTILE_SECRET:}
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5178}
