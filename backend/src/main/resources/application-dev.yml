spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
#    username: ${MYSQL_USER:root}
#    password: ${MYSQL_PASSWORD:root}
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}
#      password: ${REDIS_PASSWORD:}
        host: localhost
        port: 6379
        password:
  sql:
    init:
      # 启动只建表（结构，幂等 CREATE TABLE IF NOT EXISTS），不插入任何数据。
      # 种子内容与博主账号均需手工导入：见 docs/服务端部署指南.md。
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

logging:
  level:
    xyz.cy666.blog.mapper: debug
    org.springframework.jdbc.core: debug
